<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armagetron Brain</title>
<style>
  :root {
    --bg: #000;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --faint: #5e5e5e;
    --hair: rgba(255, 255, 255, 0.08);
    --accent: #339cff;
  }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .top { position: fixed; left: 28px; top: 22px; pointer-events: none; }
  h1 { font-size: 21px; font-weight: 500; margin: 0; letter-spacing: 0.01em; }
  #status { color: var(--muted); font-size: 14px; margin-top: 4px; text-shadow: 0 0 6px #000; }
  h1 { text-shadow: 0 0 8px #000; }
  #status .flash { color: var(--accent); }
  .toggles { position: fixed; right: 28px; top: 22px; display: flex; gap: 8px; align-items: center; }
  .toggles button { background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--muted); border: 1px solid var(--hair);
    border-radius: 999px; padding: 6px 15px; font: inherit; font-size: 14px; cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .toggles button.on { color: var(--text); border-color: rgba(255, 255, 255, 0.28); }
  .toggles button:disabled { opacity: 0.35; cursor: default; }
  .toggles .sep { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.14); margin: 0 6px; }
  #train { position: fixed; right: 28px; top: 78px; width: 236px; text-shadow: 0 0 6px #000; }
  #trainHead { color: var(--muted); font-size: 14px; height: 31px; display: flex; align-items: center; }
  .trow { display: flex; align-items: center; gap: 10px; height: 31px; font-size: 14px; color: var(--muted); }
  .trow .k { flex: 1; white-space: nowrap; }
  .trow .v { color: var(--text); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .trow canvas { width: 56px; height: 16px; flex: none; }
  #moves { position: fixed; right: 28px; bottom: 26px; width: 250px; }
  .row { display: flex; align-items: center; gap: 12px; height: 31px; color: var(--muted); font-size: 15px; }
  .row .name { width: 72px; }
  .row .bar { flex: 1; height: 3px; background: var(--hair); border-radius: 2px; overflow: hidden; }
  .row .bar i { display: block; height: 100%; width: 0; opacity: 0.4; transition: width 80ms linear; }
  .row .pct { width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
  .row.pick { color: var(--text); }
  .row.pick .bar i { opacity: 1; }
  .row.off { color: #3c3c3c; }
  #value { color: var(--muted); font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  #arenaBox { position: fixed; left: 28px; bottom: 26px; }
  #arena { width: 210px; height: 210px; display: block; }
  #result { color: var(--muted); font-size: 13px; margin-top: 8px; height: 18px; }
  #legend { color: var(--faint); font-size: 12px; margin-top: 2px; }
  #legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 5px 1px 0; }
  #legend span { margin-right: 12px; }
  .label { position: fixed; transform: translate(-50%, 0); color: var(--faint); font-size: 12px;
    white-space: nowrap; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .label.left { transform: translate(0, -50%); }
  #tip { position: fixed; display: none; pointer-events: none; background: rgba(0, 0, 0, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 8px; padding: 6px 10px; font-size: 13px;
    line-height: 1.35; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #tip .d { color: var(--muted); }
  #keys { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: var(--faint);
    font-size: 12px; pointer-events: none; white-space: nowrap; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div class="top">
  <h1>Brain</h1>
  <div id="status">connecting</div>
</div>
<div class="toggles">
  <button id="bPause">Pause</button>
  <button id="bStep" disabled>Step</button>
  <button id="bSpeed">1×</button>
  <span class="sep"></span>
  <button id="tRotate" class="on">Rotate</button>
  <button id="tLines" class="on">Lines</button>
  <button id="tGlow" class="on">Glow</button>
  <button id="tFlat">Flat</button>
  <button id="tStats" class="on">Stats</button>
</div>
<div id="train" hidden><div id="trainHead"></div><div id="trainRows"></div></div>
<div id="arenaBox">
  <canvas id="arena"></canvas>
  <div id="result"></div>
  <div id="legend"><span><i style="background:#22d3ee"></i>you</span><span><i style="background:#fb923c"></i>enemy</span><span><i style="background:#9ca3af"></i>walls</span><span><i style="background:#f472b6"></i>territory</span></div>
</div>
<div id="moves"></div>
<div id="labels"></div>
<div id="tip"></div>
<div id="keys">space pause · → step · [ ] speed · - = brightness · drag to turn · hover a neuron</div>
<div id="wait">waiting for the brain</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------------ layout
const COL = 3.2;                                   // distance between layer columns
const BAND = {                                     // vertical band of each branch
  local:     { y:  4.1,  h: 2.4 },                  // the player view, 2 m
  close:     { y:  1.45, h: 2.4 },                  // the player view, 1 m
  global:    { y: -1.2,  h: 2.4 },                  // the minimap
  territory: { y: -3.85, h: 2.4 },                  // who gets where first
  player:    { y:  2.78, h: 4.4 },                  // the player-view tower: both views around the cycle
  arena:     { y: -2.52, h: 4.4 },                  // the arena tower: minimap and territory
  scalars:   { y: -5.9,  h: 1.1 },
  trunk:     { y:  0.0,  h: 5.0 },
  head:      { y:  0.0,  h: 3.0 },
};
const CENTER = new THREE.Vector3(COL * 4.5, -0.9, 0);
const VIEW_ANGLED = new THREE.Vector3(-18, 7, 32);
const VIEW_FLAT = new THREE.Vector3(0, 0, 40);
const SPEEDS = [0.25, 0.5, 1, 2, 4];

const PLANE_COLORS = {                             // input cells: colour of the most important bit
  'walls': '#9ca3af', 'own trail': '#22d3ee', 'own head': '#a5f3fc', 'enemy trails': '#fb923c',
  'enemy heads': '#f87171', 'enemy paths': '#a16207', 'team trails': '#4ade80', 'team heads': '#86efac',
  'outside': '#2e2e2e',
  'mine first': '#22d3ee', 'enemy first': '#fb923c',   // territory: my region in my colour, theirs in theirs
};
const PRIORITY = ['enemy heads', 'own head', 'team heads', 'own trail', 'enemy trails', 'team trails',
                  'walls', 'enemy paths', 'outside', 'mine first', 'enemy first'];
// each branch has its own hue, so you can see where a signal came from; the trunk, where the
// three meet, stays neutral, and each move has its own colour
const BRANCH_COLORS = { local: '#38bdf8', close: '#2dd4bf', global: '#a78bfa', territory: '#f472b6', scalars: '#fbbf24',
                        player: '#38bdf8', arena: '#a78bfa',
                        trunk: '#f1f5f9', head: '#ffffff' };
const MOVE_COLORS = ['#4ade80', '#60a5fa', '#e879f9', '#f87171'];

function mulberry32(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function unitCount(L) { return L.shape.reduce((a, b) => a * b, 1); }

// positions (and point sizes) of every unit of a layer, in the order the server sends them
function layoutLayer(L, rand) {
  const n = unitCount(L), pos = new Float32Array(n * 3), size = new Float32Array(n);
  const g = BAND[L.group], x0 = L.col * COL;
  const put = (i, x, y, z, s) => { pos[3 * i] = x; pos[3 * i + 1] = y; pos[3 * i + 2] = z; size[i] = s; };
  if (L.kind === 'input' && L.shape.length === 2) {
    const [H, W] = L.shape, d = g.h / (H - 1);
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++)
      put(r * W + c, x0, g.y + g.h / 2 - r * d, -g.h / 2 + c * d, d * 1.15);
  } else if (L.kind === 'conv') {
    // a slab: the layer's own grid faces the flow, its filters stacked in depth, so an active
    // region of the slab sits in front of the part of the map it is looking at
    const [C, H, W] = L.shape, d = g.h / H, depth = Math.min(2.0, 1.1 + 0.6 * Math.log2(C / 32));
    const s = Math.min(d * 0.3, 0.07), jit = d * (H >= 16 ? 0.35 : 0.5);
    for (let ch = 0; ch < C; ch++) {
      const xc = x0 + (ch / (C - 1) - 0.5) * depth;
      for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++)
        put((ch * H + y) * W + xx, xc + (rand() - 0.5) * depth / C,
            g.y + g.h / 2 - (y + 0.5) * d + (rand() - 0.5) * jit,
            -g.h / 2 + (xx + 0.5) * d + (rand() - 0.5) * jit, s);
    }
  } else if (L.kind === 'output') {
    for (let i = 0; i < n; i++)
      put(i, x0, L.id === 'value' ? -2.3 : 1.25 - i * 0.75, 0, 0.26);
  } else {                                         // dense layers and the number inputs: a thick cloud
    const side = Math.ceil(Math.sqrt(n)), input = L.kind === 'input';
    const h = input || L.group === 'scalars' ? g.h : Math.min(g.h, 0.62 * g.h + n / 900);
    const d = h / Math.max(side - 1, 1), depth = input ? 0.05 : 0.5 + 0.4 * Math.log2(n / 128);
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / side), c = i % side;
      put(i, x0 + (rand() - 0.5) * depth, g.y + h / 2 - r * d + (rand() - 0.5) * d * 0.6,
          -h / 2 + c * d + (rand() - 0.5) * d * 0.6, Math.max(d * 0.45, 0.03));
    }
  }
  return { pos, size };
}

// ------------------------------------------------------------------ scene
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
camera.position.copy(CENTER).add(VIEW_ANGLED);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(CENTER);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 6;
controls.maxDistance = 80;

// highlights roll off instead of clipping to white; - and = adjust the exposure
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
// the post-processing target needs its own multisampling, or every line turns jagged
const target4x = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, target4x);
composer.setPixelRatio(DPR);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.35, 0.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const pointMaterial = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 1000 }, uMin: { value: 2.0 }, uMax: { value: 12.0 } },
  vertexShader: `
    attribute float act; attribute float size; attribute vec3 tint;
    uniform float uScale, uMin, uMax; varying float vA; varying vec3 vT;
    void main() {
      vA = act; vT = tint;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = clamp(size * (0.8 + 1.3 * act) * uScale / -mv.z, uMin, uMax);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA; varying vec3 vT;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;        // 0 at the centre, 1 at the rim
      if (d > 1.0) discard;
      float e = fwidth(d) * 1.2;                            // one pixel of antialiasing
      float core = 1.0 - smoothstep(0.5 - e, 0.5 + e, d);  // a crisp dot
      float halo = (1.0 - d) * (1.0 - d) * 0.5;            // and a thin soft skirt around it
      float shape = max(core, halo);
      // nearly nothing when silent: a slab stacks dozens of filters on one pixel, and the
      // picture must come from the neurons that fire, not from the sheer number of them
      float lit = pow(vA, 1.6);
      vec3 col = mix(vT, vec3(1.0), 0.3 * lit);            // the hottest neurons lean white, but keep their colour
      gl_FragColor = vec4(col * (0.03 + 0.72 * lit), shape * (0.05 + 0.8 * lit));
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const lineMaterial = new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});

let T = null;          // everything derived from the current topology
let points = null, lines = null;
let shown = null, target = null;   // displayed and latest activations of every unit (0..1)
let flash = 0;         // 1 right after new weights arrive, fading out
let last = null;       // the latest frame, for the tooltip
const lastInput = {};  // raw input bytes of the latest frame, by layer id

function b64(s, Type) {
  const bin = atob(s), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return Type === Uint32Array ? new Uint32Array(u8.buffer) : u8;
}

function buildPoints(layers) {
  const rand = mulberry32(7);
  const start = [], parts = [];
  let total = 0;
  for (const L of layers) {
    start.push(total);
    const p = layoutLayer(L, rand);
    parts.push(p);
    total += unitCount(L);
  }
  const pos = new Float32Array(total * 3), size = new Float32Array(total), tint = new Float32Array(total * 3);
  parts.forEach((p, i) => { pos.set(p.pos, start[i] * 3); size.set(p.size, start[i]); });
  const col = new THREE.Color();
  layers.forEach((L, i) => {
    for (let u = 0; u < unitCount(L); u++) {
      col.set(L.id === 'policy' ? MOVE_COLORS[u] : BRANCH_COLORS[L.group] || '#ffffff');
      tint.set([col.r, col.g, col.b], 3 * (start[i] + u));
    }
  });
  const hue = tint.slice();  // the resting colours; input cells are recoloured by their content
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('tint', new THREE.BufferAttribute(tint, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('act', new THREE.BufferAttribute(new Float32Array(total), 1).setUsage(THREE.DynamicDrawUsage));
  geo.computeBoundingSphere();
  if (points) { scene.remove(points); points.geometry.dispose(); }
  points = new THREE.Points(geo, pointMaterial);
  points.frustumCulled = false;
  points.renderOrder = 1;  // on top of the lines
  scene.add(points);
  shown = new Float32Array(total);
  target = new Float32Array(total);
  return { start, pos, total, hue };
}

function buildLines(topo) {
  const idx = Object.fromEntries(topo.layers.map((L, i) => [L.id, i]));
  let n = 0;
  const groups = topo.edges.map(e => {
    const si = b64(e.si, Uint32Array), di = b64(e.di, Uint32Array), w = b64(e.w), dw = e.dw ? b64(e.dw) : null;
    n += si.length;
    // many near-parallel lines between two layers pile up into a solid bar; thin the big groups
    return { s0: T.start[idx[e.src]], d0: T.start[idx[e.dst]], si, di, w, dw, gain: Math.min(1, 1500 / si.length),
             toOutput: topo.layers[idx[e.dst]].kind === 'output' };
  });
  const pos = new Float32Array(n * 6), src = new Uint32Array(n), colOf = new Uint32Array(n),
        wt = new Float32Array(n), dwt = new Float32Array(n);
  let k = 0;
  for (const g of groups) for (let j = 0; j < g.si.length; j++, k++) {
    const a = g.s0 + g.si[j], b = g.d0 + g.di[j];
    pos.set(T.pos.subarray(3 * a, 3 * a + 3), 6 * k);
    pos.set(T.pos.subarray(3 * b, 3 * b + 3), 6 * k + 3);
    src[k] = a; colOf[k] = g.toOutput ? b : a;  // a line takes its source's colour; the last ones, their move's
    wt[k] = g.w[j] / 255 * g.gain; dwt[k] = g.dw ? g.dw[j] / 255 : 0;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 6), 3).setUsage(THREE.DynamicDrawUsage));
  const visible = lines ? lines.visible : true;
  if (lines) { scene.remove(lines); lines.geometry.dispose(); }
  lines = new THREE.LineSegments(geo, lineMaterial);
  lines.frustumCulled = false;
  lines.renderOrder = 0;
  lines.visible = visible;
  scene.add(lines);
  T.lineSrc = src; T.lineCol = colOf; T.lineW = wt; T.lineDW = dwt; T.nLines = n;
}

function updateLines() {
  if (!lines || !lines.visible) return;
  const col = lines.geometry.attributes.color.array, n = T.nLines, tint = points.geometry.attributes.tint.array;
  for (let k = 0; k < n; k++) {
    const w = T.lineW[k], a = shown[T.lineSrc[k]], c = 3 * T.lineCol[k];
    const lum = Math.min(1, w * 0.004 + w * a * a * 0.24);
    // new weights: a soft white pulse, strongest on the connections that moved most
    const dw = T.lineDW[k], fl = dw * dw * flash * 0.2;
    const r = lum * tint[c] + fl, g = lum * tint[c + 1] + fl, b = lum * tint[c + 2] + fl;
    col[6 * k] = col[6 * k + 3] = r; col[6 * k + 1] = col[6 * k + 4] = g; col[6 * k + 2] = col[6 * k + 5] = b;
  }
  lines.geometry.attributes.color.needsUpdate = true;
}

// ------------------------------------------------------------------ labels
const labelBox = document.getElementById('labels');
function unitPos(u) { return new THREE.Vector3(T.pos[3 * u], T.pos[3 * u + 1], T.pos[3 * u + 2]); }
function buildLabels(layers) {
  labelBox.innerHTML = '';
  T.labels = [];
  const add = (text, at, pri, anchor) => {
    const el = document.createElement('div');
    el.className = 'label' + (anchor === 'left' ? ' left' : '');
    el.textContent = text;
    labelBox.appendChild(el);
    T.labels.push({ el, at, pri, anchor, w: el.offsetWidth || text.length * 6.6 });
  };
  layers.forEach((L, i) => {
    if (L.kind === 'output') {                     // named at the neuron itself
      const names = L.names || [L.label];
      names.forEach((nm, u) => add(nm, unitPos(T.start[i] + u).add(new THREE.Vector3(0.4, 0, 0)), 1, 'left'));
      return;
    }
    let minY = Infinity;
    for (let u = 0; u < unitCount(L); u++) minY = Math.min(minY, T.pos[3 * (T.start[i] + u) + 1]);
    add(L.label, new THREE.Vector3(L.col * COL, minY - 0.45, 0), L.kind === 'input' ? 0 : 2, 'center');
  });
}
const tmp = new THREE.Vector3();
function placeLabels() {
  if (!T || !T.labels) return;
  const w = window.innerWidth, h = window.innerHeight;
  // the panels come first, so no label is ever drawn across them
  const placed = [...document.querySelectorAll('.top, .toggles, #train:not([hidden]), #arenaBox, #moves')]
    .map(el => el.getBoundingClientRect()).map(b => ({ x0: b.left, x1: b.right, y0: b.top, y1: b.bottom }));
  const items = T.labels.map(l => {
    tmp.copy(l.at).project(camera);
    return { l, x: (tmp.x * 0.5 + 0.5) * w, y: (-tmp.y * 0.5 + 0.5) * h, z: tmp.z };
  });
  items.sort((a, b) => a.l.pri - b.l.pri || a.x - b.x);
  for (const it of items) {
    const { l } = it;
    if (it.z > 1 || it.x < -20 || it.x > w + 20 || it.y < 0 || it.y > h) { l.el.style.display = 'none'; continue; }
    const r = l.anchor === 'left'
      ? { x0: it.x, x1: it.x + l.w, y0: it.y - 8, y1: it.y + 8 }
      : { x0: it.x - l.w / 2, x1: it.x + l.w / 2, y0: it.y, y1: it.y + 16 };
    // a label that would sit on top of another stays hidden; inputs and outputs have priority
    if (placed.some(p => r.x0 < p.x1 + 8 && r.x1 > p.x0 - 8 && r.y0 < p.y1 + 3 && r.y1 > p.y0 - 3)) {
      l.el.style.display = 'none';
      continue;
    }
    placed.push(r);
    l.el.style.display = '';
    l.el.style.left = `${it.x}px`;
    l.el.style.top = `${it.y}px`;
  }
}

// ------------------------------------------------------------------ side panels
const movesBox = document.getElementById('moves');
function buildMoves(names) {
  movesBox.innerHTML = names.map((n, i) =>
    `<div class="row"><span class="name">${n}</span><span class="bar"><i style="background:${MOVE_COLORS[i]}"></i></span><span class="pct"></span></div>`
  ).join('') + '<div id="value"></div>';
}
function showMoves(f) {
  const rows = movesBox.querySelectorAll('.row');
  rows.forEach((row, i) => {
    const p = f.probs[i];
    row.classList.toggle('pick', i === f.action);
    row.classList.toggle('off', !f.mask[i]);
    row.querySelector('i').style.width = `${(p * 100).toFixed(1)}%`;
    row.querySelector('.pct').textContent = f.mask[i] ? `${Math.round(p * 100)}%` : '';
  });
  const v = f.value;
  document.getElementById('value').textContent = `Value ${v >= 0 ? '+' : ''}${v.toFixed(2)}`;
}

const arena = document.getElementById('arena'), actx = arena.getContext('2d');
let trails = {}, lastRound = null;
function drawArena(f) {
  const dpr = Math.min(window.devicePixelRatio, 2), S = 210;
  if (arena.width !== S * dpr) { arena.width = arena.height = S * dpr; }
  if (f.round !== lastRound) { trails = {}; lastRound = f.round; }
  const [lx, ly, hx, hy] = f.bounds, pad = 8, span = Math.max(hx - lx, hy - ly) || 1;
  const k = (S - 2 * pad) / span, ox = pad + ((S - 2 * pad) - (hx - lx) * k) / 2, oy = pad + ((S - 2 * pad) - (hy - ly) * k) / 2;
  const X = x => (ox + (x - lx) * k) * dpr, Y = y => (S - (oy + (y - ly) * k)) * dpr;
  actx.clearRect(0, 0, arena.width, arena.height);
  actx.strokeStyle = 'rgba(255,255,255,0.14)';
  actx.lineWidth = dpr;
  actx.strokeRect(X(lx), Y(hy), (hx - lx) * k * dpr, (hy - ly) * k * dpr);
  const walls = f.walls > 0 ? f.walls : Infinity;
  for (const [pid, x, y, alive, color] of f.cycles) {
    const t = trails[pid] || (trails[pid] = { color, pts: [], len: 0, alive: true, diedAt: null });
    const lastPt = t.pts[t.pts.length - 1];
    if (alive && (!lastPt || Math.hypot(lastPt[0] - x, lastPt[1] - y) > 0.4)) {
      if (lastPt) t.len += Math.hypot(lastPt[0] - x, lastPt[1] - y);
      t.pts.push([x, y]);
      // the engine forgets the far end of a wall past WALLS_LENGTH; so does the map
      while (t.pts.length > 1 && t.len - Math.hypot(t.pts[1][0] - t.pts[0][0], t.pts[1][1] - t.pts[0][1]) >= walls) {
        t.len -= Math.hypot(t.pts[1][0] - t.pts[0][0], t.pts[1][1] - t.pts[0][1]);
        t.pts.shift();
      }
    }
    if (t.alive && !alive) t.diedAt = f.time;
    t.alive = alive;
  }
  for (const [pid, t] of Object.entries(trails)) {
    if (t.pts.length < 1) continue;
    if (!t.alive && t.diedAt != null && f.time - t.diedAt > 8) continue;  // a dead cycle's wall is gone after 8 s
    const me = Number(pid) === f.me;
    actx.strokeStyle = t.color;
    actx.globalAlpha = t.alive ? 1 : 0.35;
    actx.lineWidth = (me ? 2 : 1.4) * dpr;
    actx.beginPath();
    t.pts.forEach(([x, y], i) => i ? actx.lineTo(X(x), Y(y)) : actx.moveTo(X(x), Y(y)));
    actx.stroke();
    if (t.alive) {
      const [x, y] = t.pts[t.pts.length - 1];
      actx.fillStyle = t.color;
      actx.beginPath(); actx.arc(X(x), Y(y), (me ? 3 : 2.4) * dpr, 0, Math.PI * 2); actx.fill();
    }
  }
  actx.globalAlpha = 1;
  document.getElementById('result').textContent = f.result ? `last round: ${f.result}` : '';
}

// ------------------------------------------------------------------ data
const statusEl = document.getElementById('status');
let lastFrameAt = 0;
let state = { paused: false, speed: 1 };

function onTopology(topo) {
  const first = !T || T.total !== topo.layers.reduce((a, L) => a + unitCount(L), 0);
  if (first) {
    T = buildPoints(topo.layers);
    T.layers = topo.layers;
    buildLabels(topo.layers);
    buildMoves(topo.layers.find(L => L.id === 'policy').names);
  }
  buildLines(topo);
  if (!first && topo.edges.some(e => e.dw)) flash = 1;
  document.getElementById('wait').style.display = 'none';
}

const tintAttr = () => points.geometry.attributes.tint;
function inputCells(layerIndex, bytes) {
  const L = T.layers[layerIndex], s0 = T.start[layerIndex], tint = tintAttr().array;
  const bitColor = L.planes.map(p => new THREE.Color(PLANE_COLORS[p] || '#ffffff'));
  const order = PRIORITY.map(p => L.planes.indexOf(p)).filter(i => i >= 0);
  const outside = L.planes.indexOf('outside');
  const territory = L.id === 'territory_in';
  for (let c = 0; c < bytes.length; c++) {
    let b = bytes[c];
    const u = s0 + c;
    if (territory) b &= 3;  // the upper bits are a distance, not a flag
    if (!b) { target[u] = 0.25; tint[3 * u] = T.hue[3 * u]; tint[3 * u + 1] = T.hue[3 * u + 1]; tint[3 * u + 2] = T.hue[3 * u + 2]; continue; }  // faint: the plane stays visible
    const bit = order.find(i => b & (1 << i));
    const col = bitColor[bit];
    tint[3 * u] = col.r; tint[3 * u + 1] = col.g; tint[3 * u + 2] = col.b;
    if (territory) { target[u] = 0.45 + 0.55 * Math.max(0, 1 - (bytes[c] >> 2) / 24); continue; }  // nearer = brighter
    // the rim is the dullest wall on the map: it stays a quiet grey while trails and heads burn
    target[u] = bit === outside ? 0.4 : L.planes[bit] === 'walls' ? 0.5 : 1;
  }
}

function onFrame(f) {
  if (!T) return;
  last = f;
  lastFrameAt = performance.now();
  const acts = b64(f.acts);
  let k = 0;
  T.layers.forEach((L, i) => {
    const s0 = T.start[i], n = unitCount(L);
    if (L.kind === 'conv' || L.kind === 'dense') {
      for (let u = 0; u < n; u++) target[s0 + u] = acts[k++] / 255;
    } else if (f.maps && f.maps[L.id] !== undefined) {
      lastInput[L.id] = b64(f.maps[L.id]);
      inputCells(i, lastInput[L.id]);
    } else if (L.id === 'scalars_in') { const s = b64(f.scalars); for (let u = 0; u < n; u++) target[s0 + u] = s[u] / 255; }
    else if (L.id === 'policy') for (let u = 0; u < n; u++) target[s0 + u] = Math.sqrt(f.probs[u]);
    else if (L.id === 'value') target[s0] = Math.min(1, Math.abs(f.value));
  });
  tintAttr().needsUpdate = true;
  showMoves(f);
  drawArena(f);
  showStatus();
}

function showStatus() {
  if (!last) return;
  const f = last, training = isTraining(f);
  const head = state.paused ? 'paused' : 'live';
  statusEl.innerHTML = training
    ? `${head} · training · update ${f.update} · <span class="${flash > 0.05 ? 'flash' : ''}">new weights ${Math.round(f.trained_ago)} s ago</span>`
    : `${head} · update ${f.update}`;
}

// ------------------------------------------------------------------ training stats
const trainBox = document.getElementById('train'), trainHead = document.getElementById('trainHead'),
      trainRows = document.getElementById('trainRows');
const pct = v => v == null ? '–' : `${Math.round(v * 100)}%`;
const num = (v, d) => v == null ? '–' : (+v).toFixed(d);
const TRAIN_ROWS = [  // rows hide themselves when the running trainer does not report that number
  { key: 'win_vs_ai_small', label: 'wins vs bot', range: [0, 1],
    value: m => m.win_vs_ai_std == null ? pct(m.win_vs_ai_small) : `${pct(m.win_vs_ai_small)} · ${pct(m.win_vs_ai_std)}` },
  { key: 'win_vs_past', label: 'wins vs past selves', range: [0, 1], value: m => pct(m.win_vs_past) },
  { key: 'win_exploiter', label: 'exploiter wins', range: [0, 1], value: m => pct(m.win_exploiter) },
  { key: 'ep_len', label: 'round', value: m => m.ep_len == null ? '–' : `${(m.ep_len / 20).toFixed(1)} s` },
  { key: 'search_kl', label: 'search gain', value: m => num(m.search_kl, 3) },
  { key: 'ent', label: 'entropy', value: m => num(m.ent, 3) },
  { key: 'kl', label: 'KL', value: m => num(m.kl, 4) },
  { key: 'clipfrac', label: 'clipped', value: m => pct(m.clipfrac) },
  { key: 'pg', label: 'policy loss', value: m => num(m.pg, 4) },
  { key: 'vf', label: 'value loss', value: m => num(m.vf, 4) },
  { key: 'aux', label: 'aux loss', value: m => num(m.aux, 4) },
  { key: 'value_explained', label: 'value explains', range: [0, 1], value: m => pct(m.value_explained) },
  { key: 'grad_norm', label: 'grad norm', value: m => num(m.grad_norm, 3) },
  { key: 'lr', label: 'learning rate', value: m => m.lr == null ? '–' : (+m.lr).toExponential(1) },
  { key: 'sps', label: 'speed',
    value: m => m.sps == null ? '–' : `${Math.round(m.sps).toLocaleString()} ${m.evals_s == null ? 'steps' : 'decisions'}/s` },
];
let metrics = null, statsOn = true;

function spark(cv, vals, range) {
  const dpr = Math.min(window.devicePixelRatio, 2), W = 56, H = 16;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  const pts = vals.map((v, i) => [i, v]).filter(p => p[1] != null && isFinite(p[1]));
  if (pts.length < 2) return;
  let lo = range ? range[0] : Math.min(...pts.map(p => p[1])), hi = range ? range[1] : Math.max(...pts.map(p => p[1]));
  if (hi - lo < 1e-9) hi = lo + 1;
  const n = Math.max(vals.length - 1, 1);
  const X = i => (dpr + i / n * (W - 2) * dpr), Y = v => (H - 1 - (v - lo) / (hi - lo) * (H - 2)) * dpr;
  c.strokeStyle = 'rgba(255,255,255,0.4)';
  c.lineWidth = dpr;
  c.lineJoin = 'round';
  c.beginPath();
  pts.forEach(([i, v], j) => j ? c.lineTo(X(i), Y(v)) : c.moveTo(X(i), Y(v)));
  c.stroke();
  const [i, v] = pts[pts.length - 1];
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(X(i), Y(v), 1.6 * dpr, 0, Math.PI * 2); c.fill();
}

// training counts as running while updates keep arriving at the run's own pace
function isTraining(f) {
  if (metrics && metrics.last.time) {
    const age = Date.now() / 1000 - metrics.last.time;
    return age < Math.max(180, 3 * (metrics.interval || 60));
  }
  return !!f && f.trained_ago != null && f.trained_ago < 120;
}
function onMetrics(m) {
  metrics = m;
  if (!trainRows.children.length) {
    trainRows.innerHTML = TRAIN_ROWS.map(r =>
      `<div class="trow" data-key="${r.key}"><span class="k">${r.label}</span><span class="v"></span><canvas></canvas></div>`).join('');
  }
  showMetrics();
}
function showMetrics() {
  if (!metrics) return;
  const { last, series } = metrics;
  const training = isTraining();
  const steps = last.steps >= 1e6 ? `${(last.steps / 1e6).toFixed(1)}M` : `${Math.round(last.steps / 1e3)}k`;
  trainHead.textContent = `${training ? 'Training' : 'Last run'} · update ${last.update} · ${steps} ${last.evals_s == null ? 'steps' : 'decisions'}`;
  TRAIN_ROWS.forEach((r, i) => {
    const row = trainRows.children[i];
    row.hidden = last[r.key] == null;
    if (row.hidden) return;
    row.querySelector('.v').textContent = r.value(last);
    spark(row.querySelector('canvas'), series[r.key] || [], r.range);
  });
  setStatsVisible();
}
function setStatsVisible() {
  const show = statsOn && !!metrics;
  if (trainBox.hidden === !show) return;
  trainBox.hidden = !show;
  applyViewOffset();
}

function onState(s) {
  state = s;
  bPause.textContent = s.paused ? 'Play' : 'Pause';
  bPause.classList.toggle('on', s.paused);
  bStep.disabled = !s.paused;
  bSpeed.textContent = `${+s.speed.toFixed(2)}×`;
  showStatus();
}

function connect() {
  const es = new EventSource('/events');
  es.addEventListener('topology', e => onTopology(JSON.parse(e.data)));
  es.addEventListener('frame', e => onFrame(JSON.parse(e.data)));
  es.addEventListener('state', e => onState(JSON.parse(e.data)));
  es.addEventListener('metrics', e => onMetrics(JSON.parse(e.data)));
  es.onerror = () => { statusEl.textContent = 'reconnecting'; };
}
connect();

// ------------------------------------------------------------------ hover: what is this neuron
const tip = document.getElementById('tip');
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(2, 2);
let mouseMoved = false, mx = 0, my = 0, lastPick = 0;
canvas.addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY;
  mouse.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  mouseMoved = true;
});
canvas.addEventListener('pointerleave', () => { tip.style.display = 'none'; });

function describe(u) {
  let li = T.layers.length - 1;
  while (li > 0 && T.start[li] > u) li--;
  const L = T.layers[li], k = u - T.start[li], a = target[u];
  if (L.kind === 'input' && L.shape.length === 2) {
    const r = Math.floor(k / L.shape[1]), c = k % L.shape[1], b = lastInput[L.id] ? lastInput[L.id][k] : 0;
    if (L.id === 'territory_in') {
      const who = (b & 1) ? 'I get here first' : (b & 2) ? 'the enemy gets here first' : 'unreachable';
      return [L.name, `cell ${r}, ${c} · ${who}${(b & 1) ? ` · ${(b >> 2) * 4} cells away` : ''}`];
    }
    const what = L.planes.filter((p, i) => b & (1 << i)).join(', ') || 'empty';
    return [L.name, `cell ${r}, ${c} · ${what}`];
  }
  if (L.id === 'scalars_in') {
    const v = last && last.numbers ? last.numbers[k] : null;
    return [L.name, `${L.names[k]}${v == null ? '' : ' · ' + (+v.toFixed(2))}`];
  }
  if (L.kind === 'conv') {
    const [, H, W] = L.shape, ch = Math.floor(k / (H * W)), rem = k % (H * W);
    return [L.name, `filter ${ch + 1} · cell ${Math.floor(rem / W)}, ${rem % W} · ${a.toFixed(2)}`];
  }
  if (L.id === 'policy') return [L.names[k], last ? `${Math.round(last.probs[k] * 100)}%` : ''];
  if (L.id === 'value') return ['value', last ? (last.value >= 0 ? '+' : '') + last.value.toFixed(2) : ''];
  return [L.name, `neuron ${k + 1} · ${a.toFixed(2)}`];
}

function pick(now) {
  if (!mouseMoved || !T || now - lastPick < 66) return;
  mouseMoved = false; lastPick = now;
  ray.params.Points.threshold = 0.004 * camera.position.distanceTo(controls.target);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObject(points);
  if (!hits.length) { tip.style.display = 'none'; return; }
  // of everything under the cursor, name what the eye sees: the brightest, nearest first on a tie
  let best = hits[0];
  for (const h of hits) if (target[h.index] > target[best.index] + 0.05) best = h;
  const [name, detail] = describe(best.index);
  tip.innerHTML = `${name}<br><span class="d">${detail}</span>`;
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.min(mx + 16, window.innerWidth - w - 12)}px`;
  tip.style.top = `${Math.min(my + 16, window.innerHeight - h - 12)}px`;
}

// ------------------------------------------------------------------ controls
const bPause = document.getElementById('bPause'), bStep = document.getElementById('bStep'),
      bSpeed = document.getElementById('bSpeed');
const tRotate = document.getElementById('tRotate'), tLines = document.getElementById('tLines'),
      tGlow = document.getElementById('tGlow'), tFlat = document.getElementById('tFlat'),
      tStats = document.getElementById('tStats');
tStats.onclick = () => { statsOn = !statsOn; tStats.classList.toggle('on', statsOn); setStatsVisible(); };
let flat = false, fly = null;
const post = body => fetch('/control', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify(body) }).catch(() => {});
function speedStep(dir) {
  let i = 0;
  for (let j = 1; j < SPEEDS.length; j++)
    if (Math.abs(Math.log(SPEEDS[j] / state.speed)) < Math.abs(Math.log(SPEEDS[i] / state.speed))) i = j;
  return SPEEDS[Math.max(0, Math.min(SPEEDS.length - 1, i + dir))];
}
bPause.onclick = () => post({ paused: !state.paused });
bStep.onclick = () => post({ step: 1 });
bSpeed.onclick = () => post({ speed: SPEEDS[(SPEEDS.indexOf(speedStep(0)) + 1) % SPEEDS.length] });
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); post({ paused: !state.paused }); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); post({ step: 1 }); }
  else if (e.key === '[') post({ speed: speedStep(-1) });
  else if (e.key === ']') post({ speed: speedStep(1) });
  else if (e.key === '-' || e.key === '=' || e.key === '+') {
    renderer.toneMappingExposure = Math.min(2.5, Math.max(0.3, renderer.toneMappingExposure * (e.key === '-' ? 0.85 : 1 / 0.85)));
    statusEl.textContent = `brightness ${Math.round(renderer.toneMappingExposure * 100)}%`;
    clearTimeout(window.__brTimer); window.__brTimer = setTimeout(showStatus, 1200);
  }
});
document.querySelectorAll('.toggles button').forEach(b => b.addEventListener('click', e => e.currentTarget.blur()));

function flyTo(offset) {
  fly = { from: camera.position.clone(), to: CENTER.clone().add(offset), t: 0 };
}
tRotate.onclick = () => { controls.autoRotate = !controls.autoRotate; tRotate.classList.toggle('on', controls.autoRotate); };
tLines.onclick = () => { if (lines) lines.visible = !lines.visible; tLines.classList.toggle('on', !lines || lines.visible); };
tGlow.onclick = () => { bloom.enabled = !bloom.enabled; tGlow.classList.toggle('on', bloom.enabled); };
tFlat.onclick = () => {
  flat = !flat;
  tFlat.classList.toggle('on', flat);
  controls.autoRotate = !flat && tRotate.classList.contains('on');
  flyTo(flat ? VIEW_FLAT : VIEW_ANGLED);
};

function applyViewOffset() {
  // with the stats panel up, the picture slides left to make room for it
  const w = window.innerWidth, h = window.innerHeight, S = trainBox.hidden ? 0 : 300;
  camera.aspect = (w + S) / h;
  camera.zoom = trainBox.hidden ? 1 : 0.9;   // and steps back a little
  camera.setViewOffset(w + S, h, S, 0, w, h);
  camera.updateProjectionMatrix();
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  applyViewOffset();
  pointMaterial.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  pointMaterial.uniforms.uMin.value = 1.3 * DPR;
  pointMaterial.uniforms.uMax.value = 6.5 * DPR;
}
window.addEventListener('resize', resize);
resize();

let prev = performance.now(), lastRender = 0, lastHeadAt = 0;
function frame(now) {
  requestAnimationFrame(frame);
  // 60 fps on its own; 30 while training runs, which shares the GPU with the trainer
  if (now - lastRender < (isTraining(last) ? 32 : 15.5)) return;
  lastRender = now;
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  if (fly) {
    fly.t = Math.min(1, fly.t + dt / 0.9);
    const e = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
    camera.position.lerpVectors(fly.from, fly.to, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  if (T) {
    const a = 1 - Math.exp(-dt * 18);
    for (let i = 0; i < shown.length; i++) shown[i] += (target[i] - shown[i]) * a;
    points.geometry.attributes.act.array.set(shown);
    points.geometry.attributes.act.needsUpdate = true;
    updateLines();
    flash = Math.max(0, flash - dt / 1.8);
    if (!state.paused && lastFrameAt && now - lastFrameAt > 3000) statusEl.textContent = 'waiting · no new decisions';
    if (metrics && now - lastHeadAt > 5000) { lastHeadAt = now; showMetrics(); }
    pick(now);
  }
  placeLabels();
  composer.render();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
