# Local match handling. Remote servers continue to set their own physics.
# Keep one deliberate turn buffered during cooldown; discard excess rapid taps.
CYCLE_INPUT_BUFFER 1
# Quicker successive corners with less loss of momentum.
CYCLE_DELAY 0.075
CYCLE_TURN_SPEED_FACTOR 0.99
# The bots think with the space fighter from the AI teacher: a look-ahead over the real
# physics on worker threads, instead of the stock bots' scripted wall tracing.
AI_FIGHTER 1
AI_FIGHTER_THREADS 3
# The camera swings round a turn instead of snapping to the new heading.
CAMERA_CUSTOM_TURN_SPEED 10
