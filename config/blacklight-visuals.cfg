# Local presentation preset. No cycle physics, AI, controls, or camera changes.
# The look: a near-black arena with a blue grid, rim walls that are dark panels
# with one glowing cyan rail, and trails with a white-hot core and a coloured
# halo from the glow pass (BLOOM settings at the end of the colour block).
