CYCLE_TURN_LEFT_TOOLTIP 0 0 0 0 0
CYCLE_TURN_RIGHT_TOOLTIP 0 0 0 0 0
CYCLE_BRAKE_TOOLTIP 0 0 0 0 0
GLANCE_LEFT_TOOLTIP 0 0 0 0 0
