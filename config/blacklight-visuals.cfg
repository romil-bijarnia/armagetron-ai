# Local presentation preset for the Legacy arena and lightcycles.
# Film reference: sculpted black lightcycles, hot optical inlays, smoked glass
# with sweeping circuit lines, flowing translucent ribbons and derezzing shards.
# Adopt the Legacy defaults once; keep later menu and appearance choices.
GRAPHICS_STYLE_DEFAULT 1
ANTIALIAS_SAMPLES 4
TEXTURE_ANISOTROPY 16
ALPHA_BLEND 1
SMOOTH_SHADING 1
TEXTURES_HI 1
TEXTURE_MODE_0 9987
TEXTURE_MODE_1 9987
TEXTURE_MODE_2 9987
TEXTURE_MODE_3 9729
# Cyan rider; native opponents select contrasting light colours.
COLOR_R_1 1
COLOR_G_1 13
COLOR_B_1 15
SPARKS 1
WHITE_SPARKS 0
EXPLOSION 1
DITHER 1
