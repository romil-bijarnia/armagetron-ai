name: Graphics checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-and-effects:
    name: Motion and effects (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and run native motion and impact checks
        shell: bash
        run: |
          set -euo pipefail
          command -v c++
          for name in lightcycle_motion lightwall_attachment camera_motion impact_animation; do
            c++ -std=c++17 -O2 -Wall -Wextra -Werror \
              "ai/tests/cpp/${name}_check.cpp" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name"
          done
      - name: Validate the bundled authored asset
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            ai/tests/cpp/lightcycle_asset_check.cpp -o "$RUNNER_TEMP/lightcycle_asset"
          "$RUNNER_TEMP/lightcycle_asset" models/lightcycle-authored.bin
      - name: Compile and exercise the native ribbon shader
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O2 -framework OpenGL \
            ai/tests/cpp/lightwall_material_check.cpp -o "$RUNNER_TEMP/lightwall_material"
          status=0
          "$RUNNER_TEMP/lightwall_material" \
            src/tron/gLightwallMaterial.h src/tron/gLightColour.h || status=$?
          if [ "$status" -eq 77 ]; then
            echo "::notice::No accelerated OpenGL context on this runner; shader runtime check requires a graphics-capable Mac."
          else
            exit "$status"
          fi
      - name: Validate capture, export and installation utilities
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            desktop/os-x/capture_preview.py \
            desktop/os-x/check_lightcycle_colours.py \
            desktop/os-x/export_lightcycle_blender.py \
            desktop/os-x/install_native_app.py \
            art/lightcycle-authored/export_game.py
          for file in desktop/os-x/build_native_app.sh script/build_and_run.sh; do
            bash -n "$file"
          done

  ai-regression:
    name: AI regression (CPU)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ai
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ./ai 'pytest>=8,<10'
      - name: Check direct learning, replay, checkpoint resume and training views
        run: |
          python -m pytest \
            ai/tests/test_direct_rl.py \
            ai/tests/test_async_brain.py \
            ai/tests/test_human_turn_buffer.py \
            ai/tests/test_input_timing.py \
            ai/tests/test_engine_pipeline.py \
            ai/tests/test_bot_roster.py \
            ai/tests/test_fighter.py \
            ai/tests/test_teacher_checkpoint.py \
            ai/tests/test_teacher_pipeline.py \
            ai/tests/test_teach.py \
            ai/tests/test_progress_state.py \
            ai/tests/test_training_modes.py \
            ai/tests/test_cli_progress.py \
            ai/tests/test_dashboard.py \
            ai/tests/test_live_view.py \
            -k 'not mps' -q

  native-linux:
    name: Linux ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [client_debug, server_debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config bison flex \
            libgl1-mesa-dev libglu1-mesa-dev libpng-dev libsdl2-dev \
            libsdl2-mixer-dev libsdl2-image-dev libboost-dev libboost-thread-dev \
            libftgl-dev libglew-dev libprotobuf-dev protobuf-compiler \
            libxml2-dev libcurl4-openssl-dev
      - name: Build and run production tests
        env:
          JOBS: '4'
          VERBOSE: '1'
        run: batch/test_builds.sh "${{ matrix.configuration }}"
